# Example em34xx configuration. Command-line options override these values.

model = "3477"
rom_dir = "roms"
allow_bad_rom = false

[emulator]
unmapped = "stop"        # stop | log | ignore
speed = 100              # percent of nominal clock; 0 = unthrottled
headless = false
scale = 1                # window size factor; the image is shown at the tube's 4:3
start_stopped = false
# straps = 0x0C          # override the configuration strap byte (2000A);
                         # default derived from [display] subtype
# eeprom = "3477.eeprom" # I2C EEPROM image (monitor alignment), created
                         # on the first write; unset = ephemeral
# nvram = "3477.nvram"   # battery-backed RAM image (the setup
                         # configuration); loaded at power-on, saved at exit;
                         # unset = cleared at every power-on (Offline Setup)

# The same ROM serves every display subtype and language.
[display]
subtype = "green"        # green | amber | paperwhite | color
crt = true               # scan-line CRT rendering (false: sharp pixels)
crt_beam = 0.30          # beam width in line pitches; larger = softer, smaller gaps

[keyboard]
type = "122"             # 122 (terminal) | enhanced
layout = "us"            # selects the terminal language; see docs/keyboard.md
# id = 0xBF              # explicit keyboard ID byte override
shift_fkeys = true       # Shift+F1..F12 enters F13..F24 (122-key keyboard)
keymap = "pcomm"         # host keymap: pcomm, positional or a TOML file (keymaps/)

[monitor]
rc = ""                  # monitor script run at start-up
history = ""             # e.g. "~/.em34xx_history"

[gdb]
enabled = false
port = 1234
wait = false

[log]
levels = "info"          # e.g. "info,bus=debug,mmio=trace"
file = ""

[twinax]
host = "none"            # none | script | tn5250
station_address = 0      # 0..6

# The TN5250 bridge is not implemented yet; these settings are validated
# and reported only.
[tn5250]
host = ""
port = 23
device_name = ""
terminal_type = ""       # "" = derive from the model and [display] subtype
                         # (3477: colour IBM-3477-FC, mono IBM-3477-FG);
                         # a [[twinax.station]] profile overrides it per station
tls = false              # TLS from the first byte; servers listen on port 992
tls_verify = "system"    # "system": the host's certificate store (Linux: the
                         # distribution CA bundle; Windows: the certificate
                         # store) plus ca_file, and the host name.
                         # "none": accept any certificate (insecure); its
                         # SHA-256 fingerprint is logged
tls_cert_sha256 = ""     # pin the server certificate instead:
                         # "AB:CD:..." as logged (colons and case optional);
                         # accepted even if its chain does not verify
ca_file = ""             # extra trusted CA certificates (PEM)
tls_min_version = "1.2"  # "ssl3", "1.0", "1.1", "1.2", "1.3"; old IBM i /
                         # OS/400 hosts may need "1.0" or "1.1"
tls_max_version = "any"  # newest version to offer ("any" = no limit)
                         # [[twinax.station]] entries may set their own
                         # tls_min_version / tls_max_version
codepage = "37"

[tn5250.env]
# KBDTYPE = "USB"
