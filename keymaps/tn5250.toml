# em34xx host keymap: the built-in "tn5250" map written out.
#
# Loading this file (--keymap keymaps/tn5250.toml) gives the same result as
# --keymap tn5250; a unit test keeps the two in step. Copy it and edit, or
# write a short file with base = "tn5250" that only lists your changes.
#
# The rules follow the key bindings of the tn5250 terminal emulator
# (tn5250(1), "Keyboard Mapping"), for keyboards without a Right Ctrl or a
# keypad: Return is Enter, and the 5250 functions are Ctrl and Alt chords
# (Ctrl+K Field Exit, Ctrl+R Reset, Ctrl+A Attn, Alt+1..0 F1..F10, ...).
# The Ctrl keys only select rules. See docs/keyboard.md ("tn5250
# assignments") for the table and for what is ours, and
# keymaps/pcomm-like.toml for the syntax.
base = "positional"

[[map]]
host = "LCtrl"
mods = "*"
to = "none"

[[map]]
host = "RCtrl"
mods = "*"
to = "none"

[[map]]
host = "Enter"
mods = "*"
to = "enter"

[[map]]
host = "KP_Enter"
mods = "*"
to = "enter"

[[map]]
host = "j"
mods = "ctrl"
to = "enter"

[[map]]
host = "m"
mods = "ctrl"
to = "enter"

[[map]]
host = "j"
mods = "ctrl lalt"
to = "newline"

[[map]]
host = "Enter"
mods = "shift"
to = "newline"

[[map]]
host = "Tab"
mods = "shift"
to = "backtab"

[[map]]
host = "i"
mods = "ctrl"
to = "tab"

[[map]]
host = "PageDown"
mods = "*"
to = "rollup"

[[map]]
host = "d"
mods = "ctrl"
to = "rollup"

[[map]]
host = "f"
mods = "ctrl"
to = "rollup"

[[map]]
host = "PageUp"
mods = "*"
to = "rolldown"

[[map]]
